<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conejo Malo Global Fans Community</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,sans-serif;
}

body{

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;

}

/* NAVBAR */

.navbar{

position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;

padding:15px 40px;

background:rgba(255,255,255,0.1);
backdrop-filter:blur(12px);

border-bottom:1px solid rgba(255,255,255,0.2);

z-index:100;

}

.logo{

font-weight:700;
font-size:20px;

}

.nav-links{

display:flex;
gap:20px;

}

.nav-links a{

color:white;
text-decoration:none;

}

/* LANGUAGE SELECT */

.lang-switch{

background:transparent;
border:1px solid white;
color:white;
padding:5px 8px;

}

/* HERO */

.hero{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

text-align:center;
padding-top:80px;

}

/* GLASS CARD */

.glass-card{

width:90%;
max-width:700px;

padding:50px;

background:rgba(255,255,255,0.12);

border-radius:20px;

border:1px solid rgba(255,255,255,0.3);

backdrop-filter:blur(18px);

box-shadow:0 10px 40px rgba(0,0,0,0.4);

animation:float 6s ease-in-out infinite;

}

/* FLOATING */

@keyframes float{

0%{transform:translateY(0)}
50%{transform:translateY(-20px)}
100%{transform:translateY(0)}

}

.hero h1{

font-size:50px;
color:#00e0ff;

}

.hero h2{

margin-top:10px;
font-size:28px;

}

.hero p{

margin-top:10px;
opacity:0.8;

}

/* BUTTONS */

.buttons{

margin-top:30px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}

.btn{

padding:12px 22px;
border-radius:8px;
border:none;
cursor:pointer;

}

.btn-primary{

background:#00e0ff;
color:black;

}

.btn-outline{

background:transparent;
border:1px solid white;
color:white;

}

/* COMMUNITY SECTION */

.community{

padding:80px 20px;
text-align:center;

}

.tiers{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;

margin-top:30px;

}

.tier{

padding:25px;
width:220px;

background:rgba(255,255,255,0.1);
border-radius:15px;

backdrop-filter:blur(10px);

}

.vip{border:2px solid gold;}
.vvip{border:2px solid cyan;}
.vvvip{border:2px solid red;}

/* LOGIN MODAL */

.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:rgba(0,0,0,0.7);

justify-content:center;
align-items:center;

}

.modal-content{

background:#111;
padding:30px;
border-radius:10px;
width:300px;

}

input{

width:100%;
padding:10px;
margin:10px 0;

}

/* FOOTER */

footer{

text-align:center;
padding:25px;
opacity:0.7;

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">CONEJO MALO</div>

<div class="nav-links">
<a href="#">Home</a>
<a href="#community">Community</a>
<a href="#" onclick="openLogin()">Login</a>
</div>

<select class="lang-switch" onchange="changeLang(this.value)">
<option value="en">EN</option>
<option value="es">ES</option>
<option value="fr">FR</option>
</select>

</div>

<!-- HERO -->

<section class="hero">

<div class="glass-card">

<h1>Conejo Malo</h1>

<h2>Bad Bunny Global Fans Community</h2>

<p>The only thing more powerful than hate is love</p>

<div class="buttons">

<button class="btn btn-primary" onclick="openLogin()">Join Community</button>

<button class="btn btn-outline" onclick="scrollCommunity()">Explore</button>

</div>

</div>

</section>

<!-- COMMUNITY -->

<section class="community" id="community">

<h2>Membership Tiers</h2>

<div class="tiers">

<div class="tier vip">

<h3>VIP ⭐</h3>
<p>Exclusive fan content</p>

</div>

<div class="tier vvip">

<h3>VVIP 💎</h3>
<p>Premium access</p>

</div>

<div class="tier vvvip">

<h3>VVVIP 👑</h3>
<p>Ultimate fan privileges</p>

</div>

</div>

</section>

<!-- LOGIN MODAL -->

<div class="modal" id="loginModal">

<div class="modal-content">

<h3>Member Login</h3>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button class="btn btn-primary">Login</button>

</div>

</div>

<footer>

© 2026 Conejo Malo Global Community

</footer>

<script>

function openLogin(){

document.getElementById("loginModal").style.display="flex"

}

function scrollCommunity(){

document.getElementById("community").scrollIntoView({behavior:"smooth"})

}

/* LANGUAGE SWITCHER */

function changeLang(lang){

alert("Language switched to: "+lang)

}

/* FIREBASE PLACEHOLDER */

const firebaseConfig={

apiKey: "AIzaSyDpFAL7wX__ee1bmbr25A81IBuWEnpq970",
authDomain: "conejomalo-global.firebaseapp.com",
projectId: "conejomalo-global",

}

</script>

</body>

</html>
